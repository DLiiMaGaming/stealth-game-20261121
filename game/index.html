<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gilded Shadow — a night-museum stealth heist</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05060f;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace, ui-monospace, monospace;
  }
  #wrap {
    width: 1280px;
    height: 800px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 1280 / 800;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #0a0d1d;
    cursor: crosshair;
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
